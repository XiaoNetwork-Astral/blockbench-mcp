name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run check

      - name: Generate prompts and API docs
        run: bun run docs

      - name: Build plugin artifact
        run: bun run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-mcp
          path: |
            dist/blockbench_mcp.js
            dist/about.md
            dist/icon.svg
          if-no-files-found: error
          retention-days: 14
